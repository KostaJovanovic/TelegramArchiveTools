[workspace]
resolver = "2"
members = [
    "crates/tga-read",
    "crates/tga-db",
    "crates/tga-docs",
    "crates/tga-notes",
    "crates/tga-stats",
    "crates/tga-metrics",
    "crates/tga-report",
    "crates/tga-app",
    # **A copy of TelegramExporter's design system, not a fork of it.** Taken
    # verbatim from `TelegramExporter/crates/tgx-ui` at 5e17d98 so the two
    # windows are one product: the same buttons, rows, type roles and rhythm.
    # Copied rather than referenced by path because a path into a sibling repo
    # is a fresh clone that does not build. Edit it there and copy it back;
    # an edit made here is a drift nobody will find.
    "crates/tgx-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# **No `preserve_order`.** serde_json's default map is a BTreeMap, so objects
# serialise with their keys sorted -- which is exactly what the Python side
# emits under `json.dumps(..., sort_keys=True)`, and the whole verification
# story is diffing those two files. Turning `preserve_order` on swaps in an
# IndexMap and the diff fills with reordering noise.
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Debug info for our own crates, none for their dependencies.
#
# Carried over from telegram_rust, where the lesson cost 45 GB: MSVC folds every
# dependency's debug info into each binary's own PDB, so one link produced a
# 350 MB PDB and every test binary got one of its own. `package."*"` matches
# every dependency and no workspace member, which is the right line -- stepping
# through our code and reading a backtrace are unchanged.
#
# This tree is far smaller than that one (no Telegram client), so the setting is
# cheap insurance rather than a rescue.
[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
