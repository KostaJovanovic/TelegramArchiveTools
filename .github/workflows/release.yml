name: Release

# A tag named v<version> builds TelegramTools.exe and TelegramViewer.exe and
# publishes them as a GitHub release, each with its SHA-256 beside it. The checks are ci.yml's: this runs only
# the release build, so tag a commit CI has already passed.
#
# The exe is unsigned (ROADMAP: "The binary is unsigned"), so a downloaded copy
# meets SmartScreen on first run. The release notes say so, and the checksum
# is how someone can tell the file they have is the file that was built here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --locked --release -p tt-app -p tt-viewer

      # The tag and the workspace must name the same version, or the
      # diagnostics the exe reports and the release page disagree about what
      # was downloaded.
      - name: Tag matches the crate version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "tag ${{ github.ref_name }} but Cargo.toml says $version"
            exit 1
          }

      - name: Checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($name in @("TelegramTools.exe", "TelegramViewer.exe")) {
            Copy-Item "target/release/$name" dist/
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
          }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          TelegramTools.exe is portable: put it in a folder of its own and run it. It keeps its settings and session beside itself.

          TelegramViewer.exe is the Viewer on its own, for reading the databases with no account and nothing else installed. Put it beside TelegramTools.exe: Settings > Viewer beside the databases copies it from there into the export folder.

          Neither exe is code-signed, so Windows SmartScreen will warn on first run (More info -> Run anyway). Check each download against its .sha256 first:

              Get-FileHash TelegramTools.exe -Algorithm SHA256
          "@
          gh release create "${{ github.ref_name }}" dist/TelegramTools.exe dist/TelegramTools.exe.sha256 dist/TelegramViewer.exe dist/TelegramViewer.exe.sha256 --title "TelegramTools ${{ github.ref_name }}" --notes $notes
