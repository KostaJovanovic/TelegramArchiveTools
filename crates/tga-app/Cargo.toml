[package]
name = "tga-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Telegram export analyser."

[[bin]]
name = "TelegramAnalyser"
path = "src/main.rs"

[dependencies]
tga-read = { path = "../tga-read" }
tga-db = { path = "../tga-db" }
tga-docs = { path = "../tga-docs" }
tga-stats = { path = "../tga-stats" }
tga-metrics = { path = "../tga-metrics" }
tga-notes = { path = "../tga-notes" }
tga-report = { path = "../tga-report" }
# The exporter's design system, so this window and that one are one product.
# See the workspace manifest for why it is a copy.
tgx-ui = { path = "../tgx-ui" }

# **`glow`, not `wgpu`, and `default-features = false` to get it.** This window
# is a list and a row of buttons; it does not need a modern graphics API, and
# wgpu drags in a compiler for one. glow is OpenGL,
# which every machine that can run Explorer already has.
#
# `default_fonts` is off because the window ships Geist and nothing else -- the
# report is set in it, and a window in a different typeface from the file it
# writes is two products.
eframe = { version = "0.33", default-features = false, features = ["glow"] }

# The native folder picker. Hand-rolling one means reimplementing the sidebar,
# the recent list and the path box, and getting a worse version of a dialog
# people already know.
rfd = "0.16"

anyhow = { workspace = true }

# The digest formats an attachment's inferred date, which is a `NaiveDate`.
chrono.workspace = true

# The command half reads a recorded --stats dump straight back into a `Stats`.
serde_json.workspace = true

# The icon and version resource, for `build.rs`. Gated on the *host*: cargo
# resolves a `cfg` build-dependency against the machine running the build
# script, which is the one that needs a resource compiler. Pinned exactly, as
# the exporter pins it: pre-1.0, and what a breaking release breaks is a build
# script, which surfaces as an error in a crate whose source did not change.
[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"
