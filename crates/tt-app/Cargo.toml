[package]
name = "tt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TelegramTools: export Telegram chats, and report on what was exported."

# **One executable.** It was three: `TelegramExporter.exe`, the exporter's
# `tgx.exe` command line, and `TelegramAnalyser.exe`. The argv decides now —
# none opens the window, `analyse` runs the analyser's command, anything else
# is one of the exporter's. See `main.rs`.
[[bin]]
name = "TelegramTools"
path = "src/main.rs"

# Three crates and no further down: the design system, the Telegram side, and
# the analyser's runner. `layering.rs` holds it there — a window that reached
# `tga-db` or `grammers-*` directly would be doing a library's work.
[dependencies]
tgx-ui = { path = "../tgx-ui" }
tgx-tg = { path = "../tgx-tg" }
tga-run = { path = "../tga-run" }

# The window toolkit. See `tgx-ui/Cargo.toml` for why glow and why no default
# fonts; the two must agree, because this crate hands `tgx-ui` the context it
# installs the design into.
eframe = { version = "0.33", default-features = false, features = ["glow"] }

# `TableBuilder`, for the queue. The one table in this window has four fixed
# count columns and one stretch column that names the chat, and laying that out
# by hand meant the same five-term subtraction written twice with a comment
# telling the next reader to re-check the sum. It is the egui project's own
# companion crate, released in lockstep with the version above, and
# `default-features = false` leaves nothing but the layout code — the image,
# SVG, datepicker and syntect extras are all opt-in and none is wanted here.
egui_extras = { version = "0.33", default-features = false }

# The native folder picker, for "Open output folder", for choosing where an
# export goes, and for pointing the library somewhere else. Hand-rolling one
# means reimplementing the sidebar, the recent list and the path box, and
# getting a worse version of a dialog people already know.
rfd = "0.16"

# The Viewer's pictures: photos, stickers, and the frames of videos and GIFs,
# decoded out of the database. eframe already links this crate for its window
# icon, with PNG only; the formats Telegram actually stores are added here —
# and here rather than in `tgx-tg`, so the engine carries no decoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# `signal` is for the command line's Ctrl-C: the JSON is streamed, so tearing
# the process down mid-write leaves a zero-byte file rather than a partial
# export.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal"] }
anyhow = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

# The Windows version in Copy diagnostics. grammers already links this exact
# crate to name the device a session signs in from, so it adds nothing.
os_info = { version = "3", default-features = false }

# Four small pieces of Win32: the run-finished notification (`notify.rs`),
# one window per data folder (`instance.rs`), the destination's free space
# and file system (`volume.rs`), and which process holds the model server's
# port (`holder.rs`, the IP helper's TCP table). Both crates are already in
# the build — eframe links this `windows-sys` and this `raw-window-handle`
# itself — so naming them here compiles nothing new.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

# Gated on the *host*, not the target: cargo resolves `build-dependencies` under
# a `cfg` section against the machine running the build script, which is the
# machine that would have to have a resource compiler. A `cargo check` on Linux
# therefore never sees this crate at all, and `build.rs` guards the same way.
#
# Pinned exactly because it is pre-1.0, so a routine `cargo update` can change
# its interface with no code change of ours. This one is worse than most to
# debug, because what it breaks is a build script — the failure surfaces as a
# build error in a crate whose source did not change. It is now the only
# exact pin left here; `gpui` and `gpui-component` carried the same warning
# and went with the UI swap.
[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"
