[package]
name = "tgx-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Swiss/International design system, in egui."

[dependencies]
# **`glow`, not `wgpu`, and `default-features = false` to get it.** This window
# is a table, a transcript and a row of buttons; it does not need a modern
# graphics API, and wgpu drags in a shader compiler for one. glow is OpenGL,
# which every machine that can run Explorer already has. The same choice
# TelegramAnalyser made, for the same reason.
#
# `default_fonts` is off because the window ships Geist and nothing else — the
# HTML export is set in it, and a window in a different typeface from the files
# it writes is two products.
#
# Not pinned exactly, unlike the `gpui` it replaces: eframe is past 0.1, ships
# a changelog and moves on a schedule, so a caret here is an ordinary
# dependency rather than the standing hazard those pins existed to contain.
eframe = { version = "0.33", default-features = false, features = ["glow"] }

# **Colour emoji**, which egui's text renderer cannot draw: it rasterises a
# glyph's outline in one colour. Windows' Segoe UI Emoji keeps its colour in a
# COLR v1 table — layers, clips, transforms, gradients. `ttf-parser` walks that
# table (it is already in the build, under egui's own font loader, at this
# version) and `tiny-skia` paints what it describes. See `emoji.rs`.
ttf-parser = "0.25"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
